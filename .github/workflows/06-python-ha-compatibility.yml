name: Python and Home Assistant Compatibility (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    if: false # Disabled for now; remove this condition when the matrix is ready for regular use.
    name: Compatibility matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade -r requirements_test.txt
      - name: Run config-flow tests
        run: pytest -q tests/test_config_flow.py
