name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Determine integration version
        id: version
        run: |
          VERSION=$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/custom_components/oregon_idtw21r/manifest.json" | jq -r '.version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --target main --title "$TAG" --notes "Oregon Scientific IDTW21xR Home Assistant integration release $TAG. Native Home Assistant Bluetooth/Bleak GATT communication and sensor decoding."
          fi
