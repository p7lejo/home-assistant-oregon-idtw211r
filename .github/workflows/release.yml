name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create v0.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v0.1.0 already exists."
          else
            gh release create v0.1.0 --repo "${{ github.repository }}" --target main --title "v0.1.0" --notes "Initial development release. Bluetooth discovery via service UUID. IDTW21xR device detection. Initial Home Assistant config flow. GATT communication not implemented yet."
          fi
